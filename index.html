<!DOCTYPE html>
<html>
<head>
    <title>Kasım ayı Yarışması ÖZEL</title>
</head>
<body>
    <h1>Rastgele takım yaratıcı</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="POST" action="{{ url_for('random_team_generator') }}">
        <label for="members">Yarışmacıların isimlerini girin (her bir yarışmacıyı virgül ile ayırın):</label>
        <input type="text" name="members" required><br>
        <label for="num_teams">Number of Teams:</label>
        <input type="number" name="num_teams" min="1" required><br>
        <input type="submit" value="Generate Teams">
    </form>
</body>
</html>
